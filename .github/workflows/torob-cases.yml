name: Torob cases data

# Fills hobby/data/torob-cases.json (and the script's own torob-state.json)
# for hobby/compare-boxes-static.html.
# Torob blocks after a handful of calls per IP, so each run takes a small bite
# and the file fills up over several runs.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/torob_cases.py
      - .github/workflows/torob-cases.yml

permissions:
  contents: write

concurrency:
  group: torob-cases
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from Torob
        run: python tools/torob_cases.py
      - name: Commit the data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add hobby/data/torob-cases.json hobby/data/torob-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Torob cases data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
