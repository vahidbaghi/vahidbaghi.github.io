name: Torob explore

# One-off: which Torob categories list exact dimensions. Lives only on the
# torob-explore branch; results are committed back to this branch.
on:
  push:
    branches: [torob-explore]
    paths:
      - tools/torob_explore/explore.py
      - .github/workflows/torob-explore.yml

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/torob_explore/explore.py ${{ matrix.job }} 6 part-${{ matrix.job }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.job }}
          path: part-${{ matrix.job }}.json

  collect:
    needs: explore
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - run: |
          mkdir -p tools/torob_explore/results
          cp parts/*.json tools/torob_explore/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tools/torob_explore/results
          git commit -m "Torob explore results $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git push origin HEAD:torob-explore
