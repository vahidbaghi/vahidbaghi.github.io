:root{--ink:#0b0b0b;--ink2:#52514e;--surface:#fcfcfb;--line:#e4e3de;}
.leaflet-container,.fh-panel,.leaflet-popup-content,.leaflet-control-layers,.leaflet-tooltip{font-family:Vazirmatn,Tahoma,sans-serif}
.leaflet-control-layers,.leaflet-tooltip{direction:rtl;text-align:right}
.school-popup table{direction:rtl;text-align:right;font-size:12.5px;border-collapse:collapse}
.school-popup th{color:var(--ink2);font-weight:600;padding:3px 0 3px 10px;white-space:nowrap;vertical-align:top}
.school-popup td{color:var(--ink);padding:3px 0}
.school-popup tr+tr{border-top:1px solid var(--line)}
.fh-panel{position:absolute;z-index:1000;top:10px;right:10px;width:min(300px,calc(100vw - 20px));max-height:calc(100% - 20px);
 overflow:auto;background:var(--surface);color:var(--ink);direction:rtl;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.16);
 padding:12px 14px;font-size:13px;line-height:1.8;transition:transform .25s}
.fh-panel.closed{transform:translateX(calc(100% + 20px))}
.fh-panel h1{font-size:16px;margin:0 0 2px;font-weight:800}
.fh-panel p{margin:0 0 8px;color:var(--ink2)}
.fh-panel ul{margin:8px 0 0;padding-inline-start:16px;color:var(--ink2)}
.fh-panel a{color:#1c5cab}
.legend{display:grid;gap:3px}.legend div{display:flex;align-items:center;gap:8px}
.sw{width:20px;height:12px;border-radius:3px;flex:none}
.fh-toggle{position:absolute;z-index:1001;top:10px;right:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
 padding:6px 12px;font-family:Vazirmatn,Tahoma,sans-serif;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);display:none}
.fh-close{float:left;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink2);line-height:1}
@media (max-width:640px){.fh-panel{top:auto;bottom:10px}}
</style>

function fhN(x) { return (x === null || x < 0) ? '—' : String(Math.round(x)).replace(/[0-9]/g, function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}); }
function fhEsc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function schoolTip(k) { return fhEsc(k[0] || 'بدون نام') + ' — ' + FH_LV[k[1]] + ' ' + FH_GD[k[2]]; }
function schoolPopup(k) {
  var rows = [
    ['نام', fhEsc(k[0] || 'بدون نام')], ['دوره', FH_LV[k[1]] + (k[3] ? ' <small>(' + fhEsc(k[3]) + ')</small>' : '')],
    ['جنسیت', FH_GD[k[2]]], ['نوع', fhEsc(k[4])], ['شهر', fhEsc(k[5])],
    ['بلندگو در ۱ متری', fhN(k[6]) + ' دسی‌بل <small>برای حیاط ' + fhN(k[7]) + ' متری</small>'],
    ['شنیده‌شدن تا ۵۵ دسی‌بل', '<b>' + fhN(k[8]) + ' متر</b> <small>(از ' + fhN(k[9]) + ' تا ' + fhN(k[10]) + ' بسته به جهت)</small>'],
    ['هاشور جلوی در', fhN(k[11]) + ' متر'],
    ['کوچهٔ منتهی تا خیابان اصلی', k[12] >= 0 ? fhN(k[12]) + ' متر' : '<small>روی خیابان اصلی یا بیش از ۲۵۰ متر</small>']
  ];
  return '<table>' + rows.map(function(r){return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'}).join('') + '</table>';
}
